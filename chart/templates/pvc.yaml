---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
 name: {{ include "ferdium.fullname" . }}-data-pvc
 namespace: {{ .Release.Namespace }}
 labels:
   {{- include "ferdium.labels" . | nindent 3 }}
   app.kubernetes.io/component: ferdium-server
spec:
{{- if .Values.persistence.data.storageClass }}
 storageClassName: {{ .Values.persistence.data.storageClass | quote }}
{{- end }}
 accessModes:
   - {{ .Values.persistence.data.accessMode | quote }}
 resources:
   requests:
     storage: {{ .Values.persistence.data.size | quote }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
 name: {{ include "ferdium.fullname" . }}-recipes-pvc
 namespace: {{ .Release.Namespace }}
 labels:
   {{- include "ferdium.labels" . | nindent 3 }}
   app.kubernetes.io/component: ferdium-server
spec:
{{- if .Values.persistence.recipes.storageClass }}
 storageClassName: {{ .Values.persistence.recipes.storageClass | quote }}
{{- end }}
 accessModes:
   - {{ .Values.persistence.recipes.accessMode | quote }}
 resources:
   requests:
     storage: {{ .Values.persistence.recipes.size | quote }}